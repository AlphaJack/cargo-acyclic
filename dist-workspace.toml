[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.0"
precise-builds = true
ci = "github"
# The archives are for cargo binstall. There are no installers.
installers = []
publish-jobs = ["./crates"]
# rustup has a rust-analyzer for each of these. The check runs it.
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
checksum = "sha256"
github-attestations = true
# release-plz drafts the release with the changelog; dist uploads to it and publishes it.
create-release = false
github-build-setup = "../build-setup.yml"
github-custom-job-permissions = { "crates" = { contents = "read" } }

[dist.github-custom-runners]
global = "ubuntu-latest"
x86_64-unknown-linux-musl = "ubuntu-latest"
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"
aarch64-apple-darwin = "macos-latest"
x86_64-pc-windows-msvc = "windows-latest"
aarch64-pc-windows-msvc = "windows-11-arm"
